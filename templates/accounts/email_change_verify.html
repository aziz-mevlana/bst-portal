{% extends 'base.html' %}
{% block title %}Yeni E-postayı Doğrula | BST Akademi{% endblock %}
{% block content %}<main class="min-h-screen bg-[var(--page-bg)] px-4 py-16 text-white"><section class="mx-auto max-w-lg rounded-3xl border border-[var(--border)] bg-[var(--surface)] p-8"><h1 class="text-2xl font-black">Yeni e-postayı doğrulayın</h1><p class="mt-3 text-sm leading-6 text-[var(--text-secondary)]">{{ email }} adresine gönderilen 6 haneli kodu girin. Doğrulanana kadar mevcut e-posta adresiniz değişmez.</p><form method="post" class="mt-6">{% csrf_token %}<label for="email-code" class="mb-2 block text-sm font-semibold">Doğrulama kodu</label><input id="email-code" name="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required class="min-h-14 w-full rounded-xl border border-[var(--border-strong)] bg-[var(--input-bg)] px-4 text-center text-2xl tracking-[.35em]"><button class="mt-5 min-h-12 w-full rounded-xl bg-blue-600 font-bold">E-postayı doğrula</button></form></section></main>{% endblock %}
