{% extends 'base.html' %}
{% block title %}Sertifikayı Düzenle | BST Portal{% endblock %}
{% block content %}<main class="min-h-screen bg-[#080d18] px-4 py-10 text-white"><div class="mx-auto max-w-2xl rounded-2xl border border-slate-700 bg-[#101827] p-6"><a class="text-cyan-300" href="{% url 'accounts:portfolio_settings' %}">← Portfolyo ayarları</a><h1 class="mt-4 text-2xl font-bold">Sertifikayı Düzenle</h1><p class="mt-2 text-slate-300">Doğrulama bilgileri değişirse sertifika yeniden onaya gönderilir.</p><form class="mt-6 space-y-4" method="post">{% csrf_token %}{% for field in form %}<label class="block text-sm">{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}<button class="rounded-lg bg-cyan-700 px-5 py-3 font-semibold" type="submit">Kaydet</button></form></div></main>{% endblock %}
