{% extends 'base.html' %}
{% block title %}E-posta Doğrulama | BST Akademi{% endblock %}
{% block content %}<main class="min-h-screen bg-[var(--page-bg)] px-4 py-16 text-white"><section class="mx-auto max-w-lg rounded-3xl border border-[var(--border)] bg-[var(--surface)] p-7 sm:p-9"><p class="text-sm font-semibold text-blue-300">{{ item.tracking_number }}</p><h1 class="mt-2 text-2xl font-black">E-posta adresinizi doğrulayın</h1><p class="mt-3 text-sm leading-6 text-[var(--text-secondary)]">{{ item.email }} adresine gönderilen 6 haneli kodu girin. Kod 10 dakika geçerlidir.</p><form method="post" class="mt-7">{% csrf_token %}<label for="verification-code" class="mb-2 block text-sm font-semibold">Doğrulama kodu</label><input id="verification-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required class="min-h-14 w-full rounded-xl border border-[var(--border-strong)] bg-[var(--input-bg)] px-4 text-center text-2xl tracking-[0.35em]"><button class="mt-5 min-h-12 w-full rounded-xl bg-blue-600 font-bold hover:bg-blue-500">Doğrula ve gönder</button></form></section></main>{% endblock %}
