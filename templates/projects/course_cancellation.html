{% if assignment.is_cancelled %}<div class="mt-3 rounded-lg border border-amber-600 p-3"><strong class="text-amber-500">İptal Edildi</strong><p>İptal tarihi: {{ assignment.cancelled_at|date:'d.m.Y H:i' }}</p><p class="whitespace-pre-line">İptal gerekçesi: {{ assignment.cancellation_reason }}</p><p>Bu çalışmanın geçmişi salt okunurdur. Yeni katılım ve akademik işlemler kapalıdır.</p></div>{% endif %}
